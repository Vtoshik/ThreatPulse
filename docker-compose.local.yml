# ThreatPulse as a private installation: database, backend and frontend.
#
#   cp .env.example .env     # set TP_USERNAME, TP_PASSWORD and JWT_SECRET
#   docker compose -f docker-compose.local.yml up --build
#
# Then open http://localhost:9000 and sign in with TP_USERNAME / TP_PASSWORD.
#
# No Kafka and no Redis: the "local" profile runs the whole pipeline in one process.
# Only the web ports are published, and only on this machine (127.0.0.1).
# The database is reachable by the backend alone.

name: threatpulse-local

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: threatpulse
      POSTGRES_USER: threatpulse
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-secret}
    volumes:
      - threatpulse_local_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U threatpulse -d threatpulse"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: local
      DATABASE_URL: jdbc:postgresql://postgres:5432/threatpulse
      DATABASE_USERNAME: threatpulse
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-secret}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env (openssl rand -base64 32)}
      TP_USERNAME: ${TP_USERNAME:?set TP_USERNAME in .env}
      TP_PASSWORD: ${TP_PASSWORD:?set TP_PASSWORD in .env}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      HUGGINGFACE_API_KEY: ${HUGGINGFACE_API_KEY:-}
      NVD_API_KEY: ${NVD_API_KEY:-}
      EMAIL_ALERTS_ENABLED: ${EMAIL_ALERTS_ENABLED:-false}
      EMAIL_ALERTS_TO: ${EMAIL_ALERTS_TO:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_SOURCE_EMAIL: ${RESEND_SOURCE_EMAIL:-}
      CORS_ALLOWED_ORIGINS: http://localhost:9000
    ports:
      - "127.0.0.1:8080:8080"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8080
        VITE_WS_URL: ws://localhost:8080/ws
    depends_on:
      - backend
    ports:
      - "127.0.0.1:9000:80"

volumes:
  threatpulse_local_data:
