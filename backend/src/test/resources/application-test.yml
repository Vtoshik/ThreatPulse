# Test profile configuration
# Datasource is overridden by @DynamicPropertySource in test classes (Testcontainers)

spring:
  # Disable Redis and Kafka auto-configuration — not needed for auth tests
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  cache:
    type: none

app:
  collector:
    # Tests must not call the real NVD and RSS servers or add background traffic
    enabled: false
  jwt:
    # Test secret — only used in tests, not a real secret
    secret: dGVzdFNlY3JldEtleVRoYXRJc0xvbmdFbm91Z2gxMjM=
    expiry-hours: 24
    refresh-expiry-days: 30
  resend:                                                   
    api-key: test-fake-key                                                    
    base-url: https://test.resend.fake                                        
    source-email: test@example.com
  nvd:                                                                        
    api-key: test-fake-key                                  
  news-api:
    key: test-fake-key                                                        
  groq:
    api-key: test-fake-key                                                    
    model: openai/gpt-oss-120b
    # No throttle in tests: nothing real is called and tests should not wait
    requests-per-minute: 0
    base-url: https://test.groq.fake                                                     
  huggingface:                                              
    api-key: test-fake-key
    model: BAAI/bge-small-en-v1.5
    base-url: https://test.huggingface.fake

logging:
  level:
    com.threatpulse: DEBUG