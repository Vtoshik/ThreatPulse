spring:
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration

  data:
    redis:
      url: ${REDIS_URL}

server:
  port: ${PORT:8080}

app:
  pipeline:
    kafka-enabled: false

  api:
    nvd-key: ${NVD_API_KEY:}
    news-api-key: ${NEWS_API_KEY:}
    huggingface-key: ${HUGGINGFACE_API_KEY:}

  groq:
    api-key: ${GROQ_API_KEY}
    model: llama-3.3-70b-versatile
    base-url: https://api.groq.com/openai/v1

  resend:
    api-key: ${RESEND_API_KEY}
    base-url: https://api.resend.com
    source-email: ${RESEND_SOURCE_EMAIL:noreply@threatpulse.dev}

  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:9000}

  jwt:
    secret: ${JWT_SECRET}
    expiry-hours: ${JWT_EXPIRY_HOURS:24}
    refresh-expiry-days: ${JWT_REFRESH_EXPIRY_DAYS:30}

logging:
  level:
    com.threatpulse: INFO
    org.springframework: WARN
