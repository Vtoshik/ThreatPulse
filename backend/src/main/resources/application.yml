# ─────────────────────────────────────────────────────────────────────────────
# application.yml — BASE CONFIGURATION (committed to git, no secrets)
#
# Contains only general settings shared across all environments.
# Real API keys and passwords go in application-dev.yml (excluded via .gitignore).
# ─────────────────────────────────────────────────────────────────────────────

spring:
  application:
    name: threatpulse
  cache:
    type: redis
  task:
    scheduling:
      pool:
        # The default is one thread, so a long collector or re-analysis run
        # would delay the alert checks until it finishes
        size: 3

  # ── JPA / Hibernate ──────────────────────────────────────────────────────────
  jpa:
    hibernate:
      # validate — checks that the DB schema matches entities but never changes it.
      # Flyway owns all schema changes, so Hibernate should never auto-create tables.
      ddl-auto: validate
    show-sql: false  # set to true only when debugging queries locally
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  # ── Flyway (database migrations) ─────────────────────────────────────────────
  flyway:
    enabled: true
    locations: classpath:db/migration  # SQL files named V1__, V2__, etc.

  # ── Kafka ─────────────────────────────────────────────────────────────────────
  kafka:
    consumer:
      # earliest — start reading from the beginning of the topic if no saved offset exists
      auto-offset-reset: earliest
      # Spring automatically deserializes JSON messages into Java objects
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      # Every analyzed record can wait several seconds for the Groq rate limit, so take few
      # records per poll and allow enough time to process them before Kafka drops the consumer
      max-poll-records: 5
      properties:
        spring.json.trusted.packages: "com.threatpulse.*"
        max.poll.interval.ms: 900000
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

app:
  collector:
    enabled: true
  pipeline:
    kafka-enabled: true
  groq:
    # The free tier limits both requests and tokens per minute. Stay below the limit
    # instead of sending a burst and getting HTTP 429 back. Zero switches the throttle off.
    requests-per-minute: 12
    # Retries after HTTP 429 or a 5xx error, waiting for the Retry-After time Groq sends
    max-retries: 3
    # If Groq asks for a longer wait (for example the daily limit is used up), give up
    max-retry-wait-seconds: 60
  reanalysis:
    # Repeats failed AI analyses and creates missing embeddings, a batch at a time
    enabled: true
    interval-ms: 300000
    initial-delay-ms: 60000
    batch-size: 20

# ── Spring Boot Actuator (health checks, metrics) ────────────────────────────
# /actuator/health is used by Railway and Docker to check if the app is alive
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized
