name: Backend CI

on:
  push:
    paths: ['backend/**']
  pull_request:
    paths: ['backend/**']

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
        - name: Checkout
          uses: actions/checkout@v4

        - name: Set up Java 21
          uses: actions/setup-java@v4
          with:                                                                          
            java-version: '21'
            distribution: 'temurin'
                                                                                         
        - name: Cache Maven                                                              
          uses: actions/cache@v4
          with:                                                                          
            path: ~/.m2/repository                           
            key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
                                                                                         
        - name: Run tests           
          run: ./mvnw test                                  
          working-directory: backend